
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Vaish ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #03030a;
    font-family: Arial, sans-serif;
    color: white;
}

/* STARS */

#stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 10;
}

.star {
    position: absolute;
    top: -30px;
    color: white;
    text-shadow: 0 0 10px white, 0 0 20px pink;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

/* COUNTDOWN */

#countdown {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 180px;
    font-weight: bold;
    text-shadow: 0 0 25px white, 0 0 50px pink;
    z-index: 3;
}

@keyframes zoom {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }
    50% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
}

/* MAIN PINK SCREEN */

#mainScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(145deg,
        #783c61, #b34d76, #42182d);
    z-index: 2;
}

/* FLOATING PARTICLES */

.particle {
    position: absolute;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 12px #ffc4e0;
    animation: float 5s infinite ease-in-out;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
        opacity: .3;
    }
    50% {
        transform: translateY(-35px);
        opacity: 1;
    }
}

/* LOADING CONTENT */

.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: center;
}

.heading {
    font-size: clamp(23px, 6vw, 38px);
    margin-bottom: 65px;
    min-height: 60px;
    text-shadow: 0 0 15px #ffb4d4;
}

.cursor {
    color: #ff8fbd;
    animation: blink .7s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

.progress-box {
    width: 100%;
    height: 17px;
    border: 2px solid #e8a4c4;
    border-radius: 30px;
    overflow: hidden;
    background: #63314d;
}

.progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
        #ff659c, #d6a0ff);
    border-radius: 30px;
    box-shadow: 0 0 15px #ff80b4;
    transition: width .1s linear;
}

.percent {
    margin-top: 17px;
    font-size: 25px;
    letter-spacing: 5px;
    color: #ffc1dd;
}

.subtext {
    margin-top: 25px;
    font-size: 14px;
    color: #ffd6e8;
    letter-spacing: 2px;
}

/* FOUND MESSAGE */

#foundMessage {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;
    font-size: clamp(30px, 7vw, 45px);
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 15px #ff7eb5,
                 0 0 35px #ff4d9b;
    animation: foundPop 1s ease;
    z-index: 4;
}

@keyframes foundPop {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
    }
    70% {
        transform: translate(-50%, -50%) scale(1.2);
    }
    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* HEART SPLASH */

#heartScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #ff8eb9, #d52c70, #500c35);
    z-index: 20;
    overflow: hidden;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.bigHeart {
    font-size: clamp(100px, 30vw, 190px);
    animation: heartBeat 1s infinite;
    filter: drop-shadow(0 0 25px #fff);
}

@keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.2); }
    50% { transform: scale(1); }
    75% { transform: scale(1.15); }
}

.splashHeart {
    position: absolute;
    bottom: -50px;
    animation: heartFloat 4s linear forwards;
    pointer-events: none;
}

@keyframes heartFloat {
    to {
        transform: translateY(-120vh) rotate(360deg) scale(1.8);
        opacity: 0;
    }
}

.heartText {
    margin-top: 25px;
    font-size: clamp(22px, 6vw, 35px);
    text-align: center;
    text-shadow: 0 0 15px white;
    animation: foundPop 1s ease;
}

</style>
</head>

<body>

<div id="stars"></div>
<div id="countdown"></div>

<!-- MAIN SCREEN -->

<div id="mainScreen">

    <div class="container" id="loadingContainer">

        <div class="heading">
            <span id="typing"></span>
            <span class="cursor">|</span>
        </div>

        <div class="progress-box">
            <div class="progress" id="progress"></div>
        </div>

        <div class="percent" id="percent">0%</div>

        <div class="subtext" id="subtext">
            ✨ Loading something special for you...
        </div>

    </div>

    <div id="foundMessage">
        FOUND THAT GIRL! ❤️
    </div>

</div>

<!-- FINAL HEART SCREEN -->

<div id="heartScreen">

    <div class="bigHeart">❤️</div>

    <div class="heartText">
        Vaish, You're My Favourite Person! 💗
    </div>

</div>

<script>

/* STAR RAIN */

const stars = document.getElementById("stars");

function starRain() {

    for(let i = 0; i < 8; i++) {

        let star = document.createElement("div");
        star.className = "star";

        star.innerHTML = ["✦", "★", "✧", "✨"][
            Math.floor(Math.random() * 4)
        ];

        star.style.left = Math.random() * 100 + "vw";
        star.style.fontSize = (12 + Math.random() * 25) + "px";
        star.style.animationDuration = (2 + Math.random() * 3) + "s";

        stars.appendChild(star);

        setTimeout(() => star.remove(), 5000);
    }
}

/* COUNTDOWN */

starRain();

let rain = setInterval(starRain, 100);

const countdown = document.getElementById("countdown");

let numbers = [3, 2, 1];
let index = 0;

function showCountdown() {

    if(index < numbers.length) {

        countdown.innerText = numbers[index];

        countdown.style.animation = "none";
        countdown.offsetHeight;
        countdown.style.animation = "zoom 1s ease";

        index++;

        setTimeout(showCountdown, 2000);

    } else {

        countdown.style.display = "none";
        clearInterval(rain);

        setTimeout(startMainScreen, 500);
    }
}

/* PINK SCREEN */

function startMainScreen() {

    document.getElementById("mainScreen").style.display = "block";

    createParticles();

    setTimeout(typeText, 1000);
}

/* PARTICLES */

function createParticles() {

    const main = document.getElementById("mainScreen");

    for(let i = 0; i < 65; i++) {

        let p = document.createElement("div");
        p.className = "particle";

        let size = Math.random() * 5 + 2;

        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "%";

        p.style.animationDuration = (3 + Math.random() * 5) + "s";
        p.style.animationDelay = Math.random() * 4 + "s";

        main.appendChild(p);
    }
}

/* INITIALIZING TYPING */

const typing = document.getElementById("typing");

let text = "Initializing Love.exe...";
let charIndex = 0;

function typeText() {

    if(charIndex < text.length) {

        typing.textContent += text[charIndex];
        charIndex++;

        setTimeout(typeText, 100);

    } else {

        setTimeout(() => {
            startLoading(50);
        }, 500);
    }
}

/* LOADING BAR */

let progress = 0;

function startLoading(target) {

    let interval = setInterval(() => {

        progress++;

        document.getElementById("progress").style.width =
            progress + "%";

        document.getElementById("percent").textContent =
            progress + "%";

        if(progress >= target) {

            clearInterval(interval);

            if(target === 50) {
                setTimeout(startSearching, 1500);
            }

            if(target === 100) {
                setTimeout(showHeartSplash, 1500);
            }
        }

    }, 45);
}

/* FINDING VAISH'S PRETTIEST SMILE */

function startSearching() {

    typing.textContent = "";
    charIndex = 0;

    text = "Finding Vaish's Prettiest Smile...";

    document.getElementById("subtext").textContent =
        "🔍 Scanning the universe for someone special...";

    typeSearching();
}

function typeSearching() {

    if(charIndex < text.length) {

        typing.textContent += text[charIndex];
        charIndex++;

        setTimeout(typeSearching, 85);

    } else {

        setTimeout(showFound, 1500);
    }
}

/* GIRL FOUND */

function showFound() {

    document.getElementById("loadingContainer").style.display = "none";

    document.getElementById("foundMessage").style.display = "block";

    setTimeout(() => {

        document.getElementById("foundMessage").style.display = "none";

        document.getElementById("loadingContainer").style.display = "block";

        typing.textContent = "Love successfully found! ❤️";

        document.getElementById("subtext").textContent =
            "💗 Preparing something special...";

        startLoading(100);

    }, 3000);
}

/* 100% COMPLETE - HEART SPLASH */

function showHeartSplash() {

    document.getElementById("mainScreen").style.display = "none";

    const screen = document.getElementById("heartScreen");
    screen.style.display = "flex";

    function createHeart() {

        let heart = document.createElement("div");

        heart.className = "splashHeart";

        heart.innerHTML = ["❤️", "💖", "💕", "💗", "💘"][
            Math.floor(Math.random() * 5)
        ];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (20 + Math.random() * 40) + "px";
        heart.style.animationDuration = (3 + Math.random() * 3) + "s";

        screen.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 180);
}

/* START WEBSITE */

setTimeout(showCountdown, 2000);

</script>

</body>
</html>
